
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF--8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Welwitchia Style — Premium Beauty</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              'brand-green': '#0FA958',
              'brand-green-dark': '#16E07B',
              'brand-gold': '#C68A2D',
              'brand-gold-dark': '#E0A93B',
              'dark-bg': '#0B0B0D',
              'dark-card': '#16181C',
              'light-text': '#1A1A1A',
              'dark-text': '#F2F2F2',
            },
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              heading: ['Poppins', 'sans-serif'],
            },
            backgroundImage: {
               'gold-gradient': 'linear-gradient(145deg, #E0A93B, #C68A2D)',
            }
          }
        }
      }
    </script>
    <style>
      /* For smooth scrolling */
      html {
        scroll-behavior: smooth;
      }
      /* Custom scrollbar for a more premium feel */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #f1f1f1;
      }
      .dark ::-webkit-scrollbar-track {
        background: #16181C;
      }
      ::-webkit-scrollbar-thumb {
        background: #C68A2D;
        border-radius: 10px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #a56f20;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react/": "https://esm.sh/react@^19.2.4/",
    "react": "https://esm.sh/react@^19.2.4",
    "i18next": "https://esm.sh/i18next@^25.8.7",
    "react-i18next": "https://esm.sh/react-i18next@^16.5.4",
    "i18next-http-backend": "https://esm.sh/i18next-http-backend@^3.0.2",
    "i18next-browser-languagedetector": "https://esm.sh/i18next-browser-languagedetector@^8.2.1"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>

</html>
